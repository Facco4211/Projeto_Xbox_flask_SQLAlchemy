{% extends 'base.html' %}

{% block main_content %}
<div class="main_contatos">
    <div class="content">
        <h1>Contato</h1>
        <form action="/contato" method="POST">
            <label for="nome">* Nome</label>
            <input type="text" id="nome" name="nome" maxlength="100" required>
            <label for="telefone">* Telefone</label>
            <input type="text" id="telefone" name="telefone" maxlength="14" required>
            <label for="email">* E-mail</label>
            <input type="email" id="email" name="email" maxlength="100" required>
            <label for="mensagem">* Mensagem</label>
            <textarea cols="100" rows="3" id="mensagem" name="mensagem" maxlength="200" required></textarea>
            <button class="botao">Enviar</button>
        </form>
    </div>
    <img src="{{ url_for('static', filename='images/halo_contato.png') }}" alt="">
</div>
{% endblock %}
